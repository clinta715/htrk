[package]
name = "htrk"
version = "0.14.1"
edition = "2021"

[features]
audio_debug = []
debug_log = []
devtools = ["eguidev_runtime"]

[dependencies]
eguidev = "0.0.2"
eguidev_runtime = { version = "0.0.2", optional = true }
eframe = "0.34"
cpal = "0.17"
ringbuf = "0.4"
hound = "3.5"
midir = "0.10"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
bincode = "1"
dirs = "5"
toml = "0.8"
chrono = "0.4"
