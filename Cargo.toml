[package]
name = "htrk"
version = "0.16.0"
edition = "2021"

[features]
audio_debug = []
debug_log = []
devtools = ["eguidev_runtime"]

[dependencies]
eguidev = "0.0.2"
eguidev_runtime = { version = "0.0.2", optional = true }
eframe = "0.34"
cpal = "0.17"
ringbuf = "0.4"
hound = "3.5"
midir = "0.10"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
bincode = "1"
dirs = "5"
toml = "0.8"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[profile.dev]
opt-level = 1

[profile.release.package."*"]
opt-level = 3
