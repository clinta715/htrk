[package]
name = "htrk"
version = "0.22.0"
edition = "2021"

[features]
audio_debug = []
debug_log = []
devtools = ["eguidev_runtime"]

[dependencies]
eguidev = "0.0.2"
eguidev_runtime = { version = "0.0.2", optional = true }
eframe = "0.34"
cpal = "0.17"
ringbuf = "0.4"
clack-host = { version = "0.1", features = ["libloading"] }
clack-common = "0.1"
clack-extensions = { version = "0.1", features = ["audio-ports", "log", "params", "state", "tail", "latency", "gui", "preset-discovery", "raw-window-handle_06", "clack-host"] }
raw-window-handle = "0.6"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
rtrb = "0.3"
hound = "3.5"
midir = "0.10"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
dirs = "5"
toml = "0.8"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = 0

[profile.dev]
opt-level = 1

[profile.release.package."*"]
opt-level = 3
